services:
  node-a:
    build: .
    environment:
      - NODE_ID=node-a
      - PEERS=node-a=http://node-a:8080,node-b=http://node-b:8080,node-c=http://node-c:8080
    ports:
      - "8081:8080"

  node-b:
    build: .
    environment:
      - NODE_ID=node-b
      - PEERS=node-a=http://node-a:8080,node-b=http://node-b:8080,node-c=http://node-c:8080
    ports:
      - "8082:8080"

  node-c:
    build: .
    environment:
      - NODE_ID=node-c
      - PEERS=node-a=http://node-a:8080,node-b=http://node-b:8080,node-c=http://node-c:8080
    ports:
      - "8083:8080"